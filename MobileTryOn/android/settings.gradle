pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'MobileTryOn'
include ':react-native-worklets'
project(':react-native-worklets').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-worklets/android')

include ':react-native-nitro-modules'
project(':react-native-nitro-modules').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-nitro-modules/android')

include ':react-native-nitro-image'
project(':react-native-nitro-image').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-nitro-image/android')

include ':react-native-vision-camera-worklets'
project(':react-native-vision-camera-worklets').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-vision-camera-worklets/android')

include ':react-native-fast-tflite'
project(':react-native-fast-tflite').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-fast-tflite/android')

include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
